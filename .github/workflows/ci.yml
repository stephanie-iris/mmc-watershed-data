name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore locked environment
        run: uv sync --locked

      - name: Run offline tests with coverage
        run: |
          uv run coverage run --source=mmc_watershed_data -m pytest
          uv run coverage report --show-missing --fail-under=70

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy src

      - name: Build release artifacts
        run: uv build --no-sources

      - name: Verify wheel and source archive
        run: uv run python scripts/verify_package.py
